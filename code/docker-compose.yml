services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risktrace
      POSTGRES_PASSWORD: risktrace
      POSTGRES_DB: risktrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risktrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://risktrace:risktrace@postgres:5432/risktrace
      PORT: "3001"
      HOST: "0.0.0.0"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
